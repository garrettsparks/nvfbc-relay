name: Dev Build

on:
  workflow_dispatch:

jobs:
  policy-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build and run policy tests
      run: |
        g++ -std=c++17 -O2 -Wall -Werror -o policytests -Isrc/core \
          tests/PolicyTests.cpp src/core/TemporalPolicy.cpp
        ./policytests

  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build Solution
      run: msbuild NvFBCR.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: nvfbc-relay-dev-build
        path: build/Release/x64/*.exe
        retention-days: 3
