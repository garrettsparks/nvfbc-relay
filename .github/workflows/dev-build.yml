name: Dev Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build Solution
      run: msbuild samples/NvFBC/NvFBCR/NvFBCR_2013.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: nvfbc-relay-dev-build
        path: samples/Release/x64/*.exe
        retention-days: 3
